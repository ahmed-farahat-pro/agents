# Nigents CI/CD Pipeline
# Auto-deploys to AWS EC2 on every push to main branch

stages:
  - test
  - build
  - deploy

variables:
  SSH_USER: ubuntu
  DEPLOY_DIR: /home/ubuntu/nigents
  GIT_DEPTH: 10
  GIT_STRATEGY: clone

# Cache node_modules between jobs and pipelines
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - mcp-servers/*/node_modules/

# Default before_script for all jobs
default:
  before_script:
    - echo "=== DEBUG Environment Variables ==="
    - echo "EC2_HOST=${EC2_HOST}"
    - echo "SSH_USER=${SSH_USER}"
    - echo "SSH_PRIVATE_KEY is set=$(if [ -n "${SSH_PRIVATE_KEY}" ]; then echo 'YES'; else echo 'NO'; fi)"
    - |
      if [ -z "${EC2_HOST}" ]; then
        echo "ERROR: EC2_HOST is not set!"
        echo "Please add EC2_HOST to GitLab CI/CD Variables"
        exit 1
      fi
    - |
      if [ -z "${SSH_PRIVATE_KEY}" ]; then
        echo "ERROR: SSH_PRIVATE_KEY is not set!"
        echo "Please add EC2_SSH_KEY to GitLab CI/CD Variables"
        exit 1
      fi
    - echo "=== Setting up SSH ==="
    - apk add --no-cache openssh-client bash
    - eval $(ssh-agent -s)
    - echo "${SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "${EC2_HOST}" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - echo "=== SSH Setup Complete ==="

# =============================================================================
# STAGE 1: TEST
# =============================================================================

lint:
  stage: test
  image: node:20-alpine
  script:
    - npm ci
    - npm run lint || echo "No lint script"
    - node --check src/bot.js
    - node --check src/dashboard/server.js
  only:
    - main
    - feature/*
    - develop

test-mcp-builds:
  stage: test
  image: node:20-alpine
  script:
    - cd mcp-servers/arabic-rtl-auditor && npm ci && npm run build && cd ../..
    - cd mcp-servers/task-splitter && npm ci && npm run build && cd ../..
    - cd mcp-servers/smart-code-search && npm ci && npm run build
  only:
    - main
    - feature/*

# =============================================================================
# STAGE 2: BUILD
# =============================================================================

build-mcps:
  stage: build
  image: node:20-alpine
  script:
    - cd mcp-servers/arabic-rtl-auditor && npm ci && npm run build && cd ../..
    - cd mcp-servers/task-splitter && npm ci && npm run build && cd ../..
    - cd mcp-servers/smart-code-search && npm ci && npm run build && cd ../..
    - tar -czf mcp-dist.tar.gz mcp-servers/*/dist/
  artifacts:
    paths:
      - mcp-dist.tar.gz
    expire_in: 1 hour
  only:
    - main
    - develop

# =============================================================================
# STAGE 3: DEPLOY
# =============================================================================

deploy-to-ec2:
  stage: deploy
  image: alpine:latest
  environment:
    name: production
    url: https://nigents.com
  script:
    - echo "=== Starting deployment to EC2 ==="
    - echo "EC2_HOST=${EC2_HOST}"
    - echo "SSH_USER=${SSH_USER}"
    - |
      cat > deploy.sh << 'EOF'
      #!/bin/bash
      set -e
      echo "Navigating to project directory..."
      cd /home/ubuntu/nigents
      echo "Pulling latest changes..."
      git fetch origin
      git reset --hard origin/main
      echo "Installing dependencies..."
      npm ci --production
      echo "Rebuilding MCP servers..."
      cd mcp-servers/arabic-rtl-auditor && npm ci && npm run build && cd ../..
      cd mcp-servers/task-splitter && npm ci && npm run build && cd ../..
      cd mcp-servers/smart-code-search && npm ci && npm run build && cd ../..
      echo "Restarting services..."
      pm2 reload nigents-bot --update-env || pm2 start src/bot.js --name nigents-bot
      pm2 reload nigents-dashboard --update-env || pm2 start src/dashboard/server.js --name nigents-dashboard
      pm2 save
      echo "Deployment complete!"
      pm2 status
      EOF
    - scp -o StrictHostKeyChecking=no deploy.sh "${SSH_USER}@${EC2_HOST}:/tmp/deploy.sh"
    - ssh -o StrictHostKeyChecking=no "${SSH_USER}@${EC2_HOST}" "chmod +x /tmp/deploy.sh && /tmp/deploy.sh"
    - ssh -o StrictHostKeyChecking=no "${SSH_USER}@${EC2_HOST}" "rm /tmp/deploy.sh"
    - echo "=== Deployment successful! ==="
  only:
    - main
  when: on_success

# =============================================================================
# UTILITY JOBS
# =============================================================================

notify-telegram:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache curl
    - |
      curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
        -d "chat_id=${TELEGRAM_CHAT_ID}" \
        -d "text=🚀 Nigents Deployment
Status: ✅ SUCCESS
Branch: ${CI_COMMIT_REF_NAME}
Commit: ${CI_COMMIT_SHORT_SHA}
Author: ${GITLAB_USER_NAME}
Dashboard: https://nigents.com" \
        -d "parse_mode=Markdown" || echo "Telegram notification failed"
  only:
    - main
  when: on_success
  allow_failure: true
