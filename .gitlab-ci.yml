# Nigents CI/CD Pipeline
# Auto-deploys to AWS EC2 on every push to main branch

stages:
  - test
  - build
  - deploy

variables:
  SSH_USER: ubuntu
  DEPLOY_DIR: /home/ubuntu/nigents
  GIT_DEPTH: 10
  GIT_STRATEGY: clone
  # MySQL Configuration for CI tests
  DB_HOST: mysql
  DB_PORT: 3306
  DB_USER: nigents
  DB_PASSWORD: nigents_test_password
  DB_NAME: nigents_test
  # MySQL Service Configuration
  MYSQL_ROOT_PASSWORD: root_password
  MYSQL_DATABASE: nigents_test
  MYSQL_USER: nigents
  MYSQL_PASSWORD: nigents_test_password

# MySQL service for tests
services:
  - mysql:8.0

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - mcp-servers/*/node_modules/

default:
  before_script:
    - echo "=== DEBUG Environment Variables ==="
    - echo "EC2_HOST=${EC2_HOST}"
    - echo "SSH_USER=${SSH_USER}"
    - echo "SSH_PRIVATE_KEY is set=$(if [ -n "${SSH_PRIVATE_KEY}" ]; then echo 'YES'; else echo 'NO'; fi)"

    - |
      if [ -z "${EC2_HOST}" ]; then
        echo "ERROR: EC2_HOST is not set!"
        exit 1
      fi

    - |
      if [ -z "${SSH_PRIVATE_KEY}" ]; then
        echo "ERROR: SSH_PRIVATE_KEY is not set!"
        exit 1
      fi

    - echo "=== Setting up SSH ==="
    - apk update
    - apk add --no-cache openssh-client bash
    - eval $(ssh-agent -s)
    - echo "${SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "${EC2_HOST}" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - echo "=== SSH Setup Complete ==="

# ============================================================
# STAGE 1: TEST
# ============================================================

lint:
  stage: test
  image: node:20-alpine
  services:
    - mysql:8.0
  variables:
    DB_HOST: mysql
    DB_PORT: 3306
    DB_USER: nigents
    DB_PASSWORD: nigents_test_password
    DB_NAME: nigents_test
    MYSQL_ROOT_PASSWORD: root_password
    MYSQL_DATABASE: nigents_test
    MYSQL_USER: nigents
    MYSQL_PASSWORD: nigents_test_password
  script:
    - npm ci
    - npm run lint || echo "No lint script"
    - node --check src/bot.js
    - node --check src/dashboard/server.js
    - node --check src/database/connection.js
    - node --check src/database/migrate.js
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^main|develop|feature\/.*|nigents\/.*$/'

test-mcp-builds:
  stage: test
  image: node:20-alpine
  script:
    - cd mcp-servers/arabic-rtl-auditor && npm ci && npm run build && cd ../..
    - cd mcp-servers/task-splitter && npm ci && npm run build && cd ../..
    - cd mcp-servers/smart-code-search && npm ci && npm run build && cd ../..
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^main|feature\/.*|nigents\/.*$/'

# ============================================================
# STAGE 2: BUILD
# ============================================================

build-mcps:
  stage: build
  image: node:20-alpine
  script:
    - cd mcp-servers/arabic-rtl-auditor && npm ci && npm run build && cd ../..
    - cd mcp-servers/task-splitter && npm ci && npm run build && cd ../..
    - cd mcp-servers/smart-code-search && npm ci && npm run build && cd ../..
    - tar -czf mcp-dist.tar.gz mcp-servers/*/dist/
  artifacts:
    paths:
      - mcp-dist.tar.gz
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

# ============================================================
# STAGE 3: DEPLOY
# ============================================================

deploy-to-ec2:
  stage: deploy
  image: alpine:latest
  environment:
    name: production
    url: https://nigents.com
  script:
    - echo "=== Starting deployment to EC2 ==="
    - echo "EC2_HOST=${EC2_HOST}"
    - echo "SSH_USER=${SSH_USER}"

    - |
      cat > deploy.sh << 'EOF'
      #!/bin/bash
      set -e

      echo "=========================================="
      echo "  NIGENTS DEPLOYMENT - MYSQL ONLY"
      echo "=========================================="

      DEPLOY_DIR=/home/ubuntu/nigents
      DATA_DIR=$DEPLOY_DIR/data

      echo "Navigating to project directory..."
      cd $DEPLOY_DIR

      echo "Creating directories..."
      mkdir -p data logs .cache src/dashboard/public/downloads

      echo "Pulling latest changes..."
      git fetch origin
      git reset --hard origin/main

      echo "Installing dependencies (includes cookie-parser for dashboard auth)..."
      npm ci --production

      echo "Rebuilding MCP servers..."
      cd mcp-servers/arabic-rtl-auditor && npm ci && npm run build && cd ../..
      cd mcp-servers/task-splitter && npm ci && npm run build && cd ../..
      cd mcp-servers/smart-code-search && npm ci && npm run build && cd ../..

      # Note: Database should already be set up. If schema changes needed:
      # sudo mysql nigents < src/database/schema.sql

      echo "Stopping all PM2 services..."
      pm2 stop all 2>/dev/null || true
      pm2 delete all 2>/dev/null || true
      
      echo "Clearing single instance locks..."
      rm -f /tmp/nigents*.lock 2>/dev/null || true
      
      echo "Waiting for processes to stop..."
      sleep 3
      
      echo "Setting up environment variables..."
      export DB_HOST=localhost
      export DB_PORT=3306
      export DB_USER=nigents
      export DB_PASSWORD=nigents_password
      export DB_NAME=nigents
      
      echo "Starting services fresh..."
      pm2 start src/bot.js --name nigents-bot --update-env
      pm2 start src/dashboard/server.js --name nigents-dashboard --update-env

      pm2 save
      echo "=========================================="
      echo "  DEPLOYMENT COMPLETE!"
      echo "=========================================="
      pm2 status
      echo ""
      echo "Checking database connection..."
      mysql -u nigents -pnigents_password -e "SELECT COUNT(*) as pending_plans FROM nigents.pending_plans WHERE status='pending';" 2>/dev/null || echo "  (Could not check database)"
      EOF

    - scp -o StrictHostKeyChecking=no deploy.sh "${SSH_USER}@${EC2_HOST}:/tmp/deploy.sh"
    - ssh -o StrictHostKeyChecking=no "${SSH_USER}@${EC2_HOST}" "chmod +x /tmp/deploy.sh && /tmp/deploy.sh"
    - ssh -o StrictHostKeyChecking=no "${SSH_USER}@${EC2_HOST}" "rm /tmp/deploy.sh"
    - echo "=== Upload public downloads (e.g. AirSound DMG) ==="
    - ssh -o StrictHostKeyChecking=no "${SSH_USER}@${EC2_HOST}" "mkdir -p ${DEPLOY_DIR}/src/dashboard/public/downloads"
    - scp -o StrictHostKeyChecking=no src/dashboard/public/downloads/AirSound-1.0.0.dmg "${SSH_USER}@${EC2_HOST}:${DEPLOY_DIR}/src/dashboard/public/downloads/"
    - echo "=== Deployment successful! ==="

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  when: on_success

# ============================================================
# TELEGRAM NOTIFICATION
# ============================================================

notify-telegram:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache curl
    - |
      MESSAGE="🚀 Nigents Deployment
      Status: ✅ SUCCESS
      Branch: ${CI_COMMIT_REF_NAME}
      Commit: ${CI_COMMIT_SHORT_SHA}
      Author: ${GITLAB_USER_NAME}
      Dashboard: https://nigents.com"

      curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
        -d "chat_id=${TELEGRAM_CHAT_ID}" \
        --data-urlencode "text=${MESSAGE}" \
        -d "parse_mode=Markdown" || echo "Telegram notification failed"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  when: on_success
  allow_failure: true