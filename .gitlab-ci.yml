# 🦉 NightOwl GitLab CI/CD Pipeline

stages:
  - lint
  - build
  - deploy
  - notify

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

# Cache node_modules
cache:
  paths:
    - node_modules/

# Lint Stage
lint:
  stage: lint
  image: node:20-alpine
  before_script:
    - npm ci
  script:
    - npm run lint || true
    - node --check src/bot.js
  tags:
    - docker

# Build Stage
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE .
    - docker push $DOCKER_IMAGE
  only:
    - main
    - master
  tags:
    - docker

# Deploy Stage
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$EC2_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - rsync -avz --exclude 'node_modules' --exclude '.git' --exclude 'logs'
        -e "ssh -o StrictHostKeyChecking=no" 
        ./ $EC2_USER@$EC2_HOST:/home/ubuntu/nightowl/
    - |
      ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << EOF
        cd /home/ubuntu/nightowl
        npm ci --production
        pm2 reload nightowl-bot || pm2 start src/bot.js --name nightowl-bot
        pm2 reload nightowl-dashboard || pm2 start src/dashboard/server.js --name nightowl-dashboard
        pm2 save
      EOF
  only:
    - main
    - master
  tags:
    - docker

# Notify Stage
notify_success:
  stage: notify
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - |
      curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
        -d "chat_id=${TELEGRAM_CHAT_ID}" \
        -d "text=✅ NightOwl deployed successfully!%0ACommit: ${CI_COMMIT_SHA:0:8}%0ABranch: ${CI_COMMIT_BRANCH}" \
        -d "parse_mode=HTML"
  when: on_success
  only:
    - main
    - master
  tags:
    - docker

notify_failure:
  stage: notify
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - |
      curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
        -d "chat_id=${TELEGRAM_CHAT_ID}" \
        -d "text=❌ NightOwl deployment failed!%0ACommit: ${CI_COMMIT_SHA:0:8}%0ACheck pipeline: ${CI_PIPELINE_URL}" \
        -d "parse_mode=HTML"
  when: on_failure
  only:
    - main
    - master
  tags:
    - docker
