# Nigents CI/CD Pipeline
# Auto-deploys to AWS EC2 on every push to main branch

stages:
  - test
  - build
  - deploy

variables:
  SSH_USER: ubuntu
  DEPLOY_DIR: /home/ubuntu/nigents
  GIT_DEPTH: 10
  GIT_STRATEGY: clone

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - mcp-servers/*/node_modules/

default:
  before_script:
    - echo "=== DEBUG Environment Variables ==="
    - echo "EC2_HOST=${EC2_HOST}"
    - echo "SSH_USER=${SSH_USER}"
    - echo "SSH_PRIVATE_KEY is set=$(if [ -n "${SSH_PRIVATE_KEY}" ]; then echo 'YES'; else echo 'NO'; fi)"

    - |
      if [ -z "${EC2_HOST}" ]; then
        echo "ERROR: EC2_HOST is not set!"
        exit 1
      fi

    - |
      if [ -z "${SSH_PRIVATE_KEY}" ]; then
        echo "ERROR: SSH_PRIVATE_KEY is not set!"
        exit 1
      fi

    - echo "=== Setting up SSH ==="
    - apk update
    - apk add --no-cache openssh-client bash
    - eval $(ssh-agent -s)
    - echo "${SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "${EC2_HOST}" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - echo "=== SSH Setup Complete ==="

# ============================================================
# STAGE 1: TEST
# ============================================================

lint:
  stage: test
  image: node:20-alpine
  script:
    - npm ci
    - npm run lint || echo "No lint script"
    - node --check src/bot.js
    - node --check src/dashboard/server.js
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^main|develop|feature\/.*$/'

test-mcp-builds:
  stage: test
  image: node:20-alpine
  script:
    - cd mcp-servers/arabic-rtl-auditor && npm ci && npm run build && cd ../..
    - cd mcp-servers/task-splitter && npm ci && npm run build && cd ../..
    - cd mcp-servers/smart-code-search && npm ci && npm run build && cd ../..
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^main|feature\/.*$/'

# ============================================================
# STAGE 2: BUILD
# ============================================================

build-mcps:
  stage: build
  image: node:20-alpine
  script:
    - cd mcp-servers/arabic-rtl-auditor && npm ci && npm run build && cd ../..
    - cd mcp-servers/task-splitter && npm ci && npm run build && cd ../..
    - cd mcp-servers/smart-code-search && npm ci && npm run build && cd ../..
    - tar -czf mcp-dist.tar.gz mcp-servers/*/dist/
  artifacts:
    paths:
      - mcp-dist.tar.gz
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

# ============================================================
# STAGE 3: DEPLOY
# ============================================================

deploy-to-ec2:
  stage: deploy
  image: alpine:latest
  environment:
    name: production
    url: https://nigents.com
  script:
    - echo "=== Starting deployment to EC2 ==="
    - echo "EC2_HOST=${EC2_HOST}"
    - echo "SSH_USER=${SSH_USER}"

    - |
      cat > deploy.sh << 'EOF'
      #!/bin/bash
      set -e

      echo "=========================================="
      echo "  NIGENTS DEPLOYMENT - DATA PRESERVING"
      echo "=========================================="

      DEPLOY_DIR=/home/ubuntu/nigents
      DATA_DIR=$DEPLOY_DIR/data
      BACKUP_DIR=/home/ubuntu/nigents-backups

      echo "Navigating to project directory..."
      cd $DEPLOY_DIR

      echo "Creating backup directory..."
      mkdir -p $BACKUP_DIR

      echo "Creating data directories if not exist..."
      mkdir -p data logs .cache

      echo "Backing up data BEFORE deployment..."
      if [ -d "$DATA_DIR" ] && [ "$(ls -A $DATA_DIR)" ]; then
        BACKUP_NAME="data.backup.$(date +%Y%m%d_%H%M%S)"
        cp -r $DATA_DIR $BACKUP_DIR/$BACKUP_NAME
        echo "Data backed up to: $BACKUP_DIR/$BACKUP_NAME"
        ls -la $BACKUP_DIR/$BACKUP_NAME/
      else
        echo "WARNING: Data directory is empty or does not exist!"
      fi

      echo "Saving pending plans info..."
      if [ -f "$DATA_DIR/pending-plans.json" ]; then
        echo "Pending plans BEFORE update:"
        cat $DATA_DIR/pending-plans.json | head -20
      fi

      echo "Pulling latest changes..."
      git fetch origin
      git reset --hard origin/main

      echo "Restoring data directory..."
      # Ensure data directory still exists (git reset might have removed it)
      mkdir -p $DATA_DIR

      echo "Installing dependencies..."
      npm ci --production

      echo "Rebuilding MCP servers..."
      cd mcp-servers/arabic-rtl-auditor && npm ci && npm run build && cd ../..
      cd mcp-servers/task-splitter && npm ci && npm run build && cd ../..
      cd mcp-servers/smart-code-search && npm ci && npm run build && cd ../..

      echo "Verifying data after build..."
      if [ -f "$DATA_DIR/pending-plans.json" ]; then
        echo "Pending plans AFTER build:"
        cat $DATA_DIR/pending-plans.json | head -20
      else
        echo "WARNING: pending-plans.json not found after build!"
      fi

      echo "Restarting services with PM2 ecosystem..."
      if [ -f "ecosystem.config.js" ]; then
        pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js
      else
        pm2 reload nigents-bot --update-env || pm2 start src/bot.js --name nigents-bot
        pm2 reload nigents-dashboard --update-env || pm2 start src/dashboard/server.js --name nigents-dashboard
      fi

      pm2 save
      echo "=========================================="
      echo "  DEPLOYMENT COMPLETE!"
      echo "=========================================="
      pm2 status
      echo ""
      echo "Data directory contents:"
      ls -la $DATA_DIR/ 2>/dev/null || echo "  (data directory is empty)"
      echo ""
      echo "Pending plans count:"
      if [ -f "$DATA_DIR/pending-plans.json" ]; then
        cat $DATA_DIR/pending-plans.json | grep -o '"task"' | wc -l
      else
        echo "0 (file not found)"
      fi
      EOF

    - scp -o StrictHostKeyChecking=no deploy.sh "${SSH_USER}@${EC2_HOST}:/tmp/deploy.sh"
    - ssh -o StrictHostKeyChecking=no "${SSH_USER}@${EC2_HOST}" "chmod +x /tmp/deploy.sh && /tmp/deploy.sh"
    - ssh -o StrictHostKeyChecking=no "${SSH_USER}@${EC2_HOST}" "rm /tmp/deploy.sh"
    - echo "=== Deployment successful! ==="

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  when: on_success

# ============================================================
# TELEGRAM NOTIFICATION
# ============================================================

notify-telegram:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache curl
    - |
      MESSAGE="🚀 Nigents Deployment
      Status: ✅ SUCCESS
      Branch: ${CI_COMMIT_REF_NAME}
      Commit: ${CI_COMMIT_SHORT_SHA}
      Author: ${GITLAB_USER_NAME}
      Dashboard: https://nigents.com"

      curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
        -d "chat_id=${TELEGRAM_CHAT_ID}" \
        --data-urlencode "text=${MESSAGE}" \
        -d "parse_mode=Markdown" || echo "Telegram notification failed"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  when: on_success
  allow_failure: true